   - Nikde jinde v kódu nic měnit nemusíš.

  /* ---------- HLAVIČKA ---------- */
  .hlavicka{
    display:flex;align-items:center;gap:14px;
    padding:18px 26px;background:var(--uhel);color:#fff;
  }
  .logo{
    font-weight:700;letter-spacing:.28em;font-size:20px;
  }
  .logo b{color:var(--cervena);}
  .hlavicka .stitek{
    margin-left:auto;font-size:11px;letter-spacing:.22em;
    text-transform:uppercase;color:#B9B7B1;font-weight:500;
  }

  /* ---------- ROZLOŽENÍ ---------- */
  .plocha{display:grid;grid-template-columns:290px 1fr;min-height:calc(100vh - 60px);}

  /* ---------- SEZNAM PRODUKTŮ ---------- */
  .seznam{background:var(--uhel);padding:20px 14px 40px;}
  .seznam .nadpisek{
    font-size:11px;letter-spacing:.24em;text-transform:uppercase;
    color:#7C7A75;font-weight:600;padding:0 12px 12px;
  }
  .polozka{
    display:flex;align-items:center;gap:12px;width:100%;
    background:transparent;border:0;cursor:pointer;text-align:left;
    padding:12px;border-radius:10px;color:#D7D5D0;
    font-family:inherit;font-size:15px;font-weight:500;
    transition:background .15s;
  }
  .polozka:hover{background:var(--uhel-svetlejsi);}
  .polozka.aktivni{background:#fff;color:var(--inkoust);}
  .polozka .cip{
    width:22px;height:22px;border-radius:50%;flex:none;
    border:2px solid rgba(255,255,255,.25);
  }
  .polozka.aktivni .cip{border-color:var(--linka);}
  .polozka .kod{margin-left:auto;font-size:11px;color:var(--seda-text);letter-spacing:.05em;}

  /* ---------- SCÉNA S PRODUKTEM ---------- */
  .scena{padding:34px 40px 60px;max-width:900px;}
  .eyebrow{
    font-size:12px;letter-spacing:.24em;text-transform:uppercase;
    color:rgba(255,255,255,.75);font-weight:600;margin-bottom:6px;
  }

/* ---- Obarvená grafika postroje (použije se, když barva nemá vlastní foto) ---- */
function grafikaPostroje(hex){
  const tmavsi = ztmav(hex, 0.72);
  return `
  <svg viewBox="0 0 260 260" xmlns="http://www.w3.org/2000/svg" aria-label="náhled postroje">
    <g fill="none" stroke="${hex}" stroke-width="20" stroke-linecap="round" stroke-linejoin="round">
      <path d="M60 40 L130 130 L200 40"/>
      <path d="M60 220 L130 130 L200 220"/>
      <path d="M130 130 L130 130"/>
    </g>
    <g fill="none" stroke="${tmavsi}" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 12">
      <path d="M60 40 L130 130 L200 40"/>
      <path d="M60 220 L130 130 L200 220"/>
    </g>
    <circle cx="130" cy="130" r="15" fill="${hex}"/>
    <circle cx="130" cy="130" r="7" fill="${tmavsi}"/>
  </svg>`;
}

/* ---- Placeholder „pes s postrojem“ (dokud nedodáš reálné fotky) ---- */
function grafikaPes(hex){
  return `
  <svg viewBox="0 0 240 180" xmlns="http://www.w3.org/2000/svg" aria-label="pes s postrojem">
    <path d="M40 120 q-6 -30 18 -34 l6 -18 q4 -12 16 -6 l4 14 q30 -6 60 4 q20 6 46 2 l10 8 q6 8 -4 12
             q-14 4 -22 2 q6 18 -6 34 l-8 0 q-4 -14 -2 -26 q-24 8 -50 4 l-4 26 l-10 0 q-2 -14 0 -28
             q-20 -2 -30 -10 q-6 8 -6 22 l-10 0 q-6 -14 4 -24 z"
          fill="#D9D7D1"/>
    <path d="M74 92 q26 -6 54 0" fill="none" stroke="${hex}" stroke-width="9" stroke-linecap="round"/>
    <path d="M92 78 l6 42" fill="none" stroke="${hex}" stroke-width="9" stroke-linecap="round"/>
    <path d="M116 82 l6 40" fill="none" stroke="${hex}" stroke-width="9" stroke-linecap="round"/>
  </svg>`;
}

/* pomůcka: ztmaví hex barvu (podíl 0–1) */
function ztmav(hex, podil){
  const n = parseInt(hex.slice(1),16);
  const r = Math.round(((n>>16)&255)*podil);
  const g = Math.round(((n>>8)&255)*podil);
  const b = Math.round((n&255)*podil);
  return `rgb(${r},${g},${b})`;
}

/* ---- Stav ---- */
let indexProduktu = 1;   // 0 = SLED, 1 = RUN LONG (má reálné fotky), 2 = GUARD ...
let indexBarvy = 0;

/* ---- Vykreslení seznamu produktů vlevo ---- */
function vykresliSeznam(){
  const box = document.getElementById('seznam');
  PRODUKTY.forEach((p, i)=>{
    const b = document.createElement('button');
    b.className = 'polozka' + (i===indexProduktu ? ' aktivni':'');
    b.innerHTML = `
      <span class="cip" style="background:${p.barvy[0].hex}"></span>
      <span>${p.nazev.replace('postroj ','')}</span>
      <span class="kod">${p.kod}</span>`;
    b.onclick = ()=>{
      indexProduktu=i; indexBarvy=0; vykresliVse();
      // Auto-scroll na začátek — funguje i pro produkty ve spodku dlouhého seznamu
      window.scrollTo({ top: 0, left: 0, behavior: 'smooth' });
    };
    box.appendChild(b);
  });
}

/* ---- Přepnutí obrázku s plynulým přechodem + pojistkou ---- */
/* Když je foto = odkaz, zkusíme ho načíst. Kdyby se nenačetl (např. ochrana */
/* serveru proti cizím webům), automaticky se ukáže obarvená grafika.        */
function nastavJeviste(foto, hex){
  const el = document.getElementById('jevisteObsah');
  el.style.opacity = 0;
  setTimeout(()=>{
    if(foto){
      const img = new Image();
      img.alt = 'náhled produktu';
      img.referrerPolicy = 'no-referrer';           // nepošle adresu našeho webu
      img.onerror = ()=>{ el.innerHTML = grafikaPostroje(hex); }; // pojistka
      img.src = foto;
      el.innerHTML = '';
      el.appendChild(img);
    } else {
      el.innerHTML = grafikaPostroje(hex);
    }
    el.style.opacity = 1;
  }, 180);
}

/* ---- Hlavní překreslení ---- */
function vykresliVse(){
  const p = PRODUKTY[indexProduktu];
  const barva = p.barvy[indexBarvy];

  // zvýraznění v seznamu
  document.querySelectorAll('.polozka').forEach((el,i)=>{
    el.classList.toggle('aktivni', i===indexProduktu);
  });

  // texty
  document.getElementById('nazevProduktu').textContent = p.nazev;
  document.getElementById('cena').innerHTML = p.cena + ' <span>vč. DPH</span>';
  document.getElementById('popis').textContent = p.popis;
  document.getElementById('cta').href = p.odkaz || '#';

  // hlavní obrázek: reálná foto (s pojistkou), nebo obarvená grafika
  nastavJeviste(barva.foto, barva.hex);

  // kolečka barev
  const boxBarvy = document.getElementById('barvy');
  boxBarvy.innerHTML = '';
  p.barvy.forEach((c,i)=>{
    const s = document.createElement('div');
    s.className = 'vzorek' + (i===indexBarvy ? ' vybrana':'');
    s.style.background = c.hex;
    s.title = c.nazev;
    s.onclick = ()=>{ indexBarvy=i; vykresliVse(); };
    boxBarvy.appendChild(s);
  });
  document.getElementById('nazevBarvy').innerHTML = 'Vybráno: <b>'+barva.nazev+'</b>';

  // ukázky na psech
  const boxPsi = document.getElementById('psi');
  boxPsi.innerHTML = '';
  if(p.naPsech && p.naPsech.length){
    p.naPsech.forEach(url=>{
      const k = document.createElement('div');
      k.className = 'karta';
      const img = new Image();
      img.alt = 'pes s postrojem ' + p.nazev;
      img.referrerPolicy = 'no-referrer';
      img.onerror = ()=>{ k.className='karta prazdna'; k.innerHTML = grafikaPes(barva.hex)+'<div class="hint">fotku se nepodařilo načíst</div>'; };
      img.src = url;
      k.appendChild(img);
      boxPsi.appendChild(k);
    });
  } else {
    for(let i=0;i<3;i++){
      const k = document.createElement('div');
      k.className = 'karta prazdna';
      k.innerHTML = grafikaPes(barva.hex) + '<div class="hint">sem přijde tvoje foto</div>';
      boxPsi.appendChild(k);
    }
  }
}

/* ---- Start ---- */
vykresliSeznam();
vykresliVse();
