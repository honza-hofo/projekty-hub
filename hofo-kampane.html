<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HOFO — Kampaně dashboard</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAzMiAzMiI+PHJlY3QgeD0iMSIgeT0iMSIgd2lkdGg9IjMwIiBoZWlnaHQ9IjMwIiByeD0iNiIgZmlsbD0iI2Q0YTI0ZSIvPjx0ZXh0IHg9IjE2IiB5PSIyMiIgZm9udC1zaXplPSIxMyIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZm9udC1mYW1pbHk9IlZlcmRhbmEiIGZpbGw9IiMxMjEwMGUiIGZvbnQtd2VpZ2h0PSJib2xkIj5IRjwvdGV4dD48L3N2Zz4=">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
       background:#12100e; color:#e4ddcf; min-height:100vh; }
.header { text-align:center; padding:34px 20px 10px; }
.header h1 { font-size:2rem; font-weight:800; letter-spacing:-.5px;
             background:linear-gradient(135deg,#d4a24e,#f0c987);
             -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.header p { color:#8a8175; font-size:.95rem; margin-top:4px; }
.container { max-width:1400px; margin:0 auto; padding:0 20px 48px; }
.updated { text-align:center; color:#6f675b; font-size:.85rem; margin:6px 0 24px; }
.kpi-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:16px; margin-bottom:28px; }
.kpi { background:#1b1814; border-radius:12px; padding:20px; border:1px solid #2a2620; }
.kpi-label { color:#8a8175; font-size:.8rem; margin-bottom:8px; text-transform:uppercase; letter-spacing:.5px; }
.kpi-value { font-size:2.2rem; font-weight:800; color:#f4efe7; font-variant-numeric:tabular-nums; }
.kpi-sub { color:#6f675b; font-size:.82rem; margin-top:4px; }
.kpi.gold .kpi-value { color:#d4a24e; }
.kpi.green .kpi-value { color:#5fbf7f; }
.kpi.blue .kpi-value { color:#5aa9d6; }
.grid-2 { display:grid; grid-template-columns:2fr 1fr; gap:20px; margin-bottom:24px; }
@media (max-width:900px){ .grid-2{ grid-template-columns:1fr; } }
.card { background:#1b1814; border-radius:12px; padding:22px; border:1px solid #2a2620; margin-bottom:24px; }
.card h2 { font-size:1.05rem; margin-bottom:16px; color:#f4efe7; display:flex; align-items:center; gap:8px; }
.chart-wrap { height:260px; position:relative; }
table { width:100%; border-collapse:collapse; font-size:.9rem; }
th { text-align:left; padding:10px 8px; color:#8a8175; font-weight:600; border-bottom:1px solid #2a2620; font-size:.72rem; text-transform:uppercase; letter-spacing:.5px; }
td { padding:11px 8px; border-bottom:1px solid #221e18; color:#d8cfbe; }
tbody tr:hover { background:#221d15; }
.num { text-align:right; font-variant-numeric:tabular-nums; font-weight:700; color:#f4efe7; }
.pill { display:inline-block; padding:3px 9px; border-radius:10px; font-size:.72rem; font-weight:700; }
.pill.on { background:#5fbf7f22; color:#5fbf7f; }
.pill.pause { background:#8a817522; color:#a89f8f; }
.pill.wait { background:#d4a24e22; color:#d4a24e; }
.pill.ext { background:#5aa9d622; color:#5aa9d6; }
.resp { padding:14px; border:1px solid #2a2620; border-radius:10px; margin-bottom:10px; background:#17140f; }
.resp .f { font-weight:700; color:#f4efe7; }
.resp .k { color:#8a8175; font-size:.85rem; margin:3px 0; }
.resp .w { color:#d4a24e; font-size:.85rem; font-weight:600; }
.foot { text-align:center; color:#4f483e; font-size:.8rem; margin-top:20px; }
</style>
</head>
<body>
<div class="header">
  <h1>HOFO — Kampaně</h1>
  <p>Přehled všech outreach aktivit HOFO Production</p>
</div>
<div class="container">
  <div class="updated" id="updated">načítám…</div>

  <div class="kpi-grid" id="kpis"></div>

  <div class="grid-2">
    <div class="card">
      <h2>📈 Odeslané e-maily v čase</h2>
      <div class="chart-wrap"><canvas id="chart"></canvas></div>
    </div>
    <div class="card">
      <h2>💬 Odpovědi</h2>
      <div id="responses"></div>
    </div>
  </div>

  <div class="card">
    <h2>📋 Kampaně</h2>
    <table>
      <thead><tr><th>Kampaň</th><th class="num">Odesláno</th><th class="num">Dnes</th><th>Období</th><th>Stav</th></tr></thead>
      <tbody id="campaigns"></tbody>
    </table>
  </div>

  <div class="foot" id="foot"></div>
</div>

<script>
const PILL = { "aktivní":"on", "pauza":"pause", "drafty čekají":"wait", "mimo lokální log":"ext", "nečitelné odsud":"ext" };
fetch('hofo-kampane-data.json?_=' + Date.now())
  .then(r => r.json())
  .then(d => {
    document.getElementById('updated').textContent = 'Aktualizováno: ' + d.updated;
    const s = d.summary;
    const kpis = [
      {l:'Celkem odesláno', v:s.total_sent.toLocaleString('cs'), sub:'napříč kampaněmi', c:'gold'},
      {l:'Dnes', v:s.today, sub:'gastro', c:'green'},
      {l:'Odpovědi', v:s.responses, sub:'zájem o nabídku', c:'blue'},
      {l:'Drafty ve frontě', v:s.drafts_pending, sub:'ke schválení/odeslání', c:''},
      {l:'Pool gastro', v:(s.pool_remaining??'—').toLocaleString('cs'), sub:'neoslovených firem', c:''},
    ];
    document.getElementById('kpis').innerHTML = kpis.map(k =>
      `<div class="kpi ${k.c}"><div class="kpi-label">${k.l}</div><div class="kpi-value">${k.v}</div><div class="kpi-sub">${k.sub}</div></div>`).join('');

    document.getElementById('campaigns').innerHTML = d.campaigns.map(c => {
      const p = PILL[c.status] || 'pause';
      const sent = typeof c.sent === 'number' ? c.sent.toLocaleString('cs') : c.sent;
      return `<tr><td><b style="color:#f4efe7">${c.name}</b><br><span style="color:#8a8175;font-size:.8rem">${c.detail||''}</span></td>
        <td class="num">${sent}</td><td class="num">${c.today||''}</td><td style="color:#a89f8f">${c.period}</td>
        <td><span class="pill ${p}">${c.status}</span></td></tr>`;
    }).join('');

    document.getElementById('responses').innerHTML = d.responses.length ? d.responses.map(r =>
      `<div class="resp"><div class="f">${r.firma}</div><div class="k">${r.kontakt}</div>
       <div class="w">chce: ${r.chce} · ${r.stav}</div></div>`).join('') : '<p style="color:#6f675b">Zatím žádné odpovědi.</p>';

    const H = d.daily_history;
    new Chart(document.getElementById('chart'), {
      type:'bar',
      data:{ labels:H.map(x=>x.date), datasets:[{ label:'Odesláno', data:H.map(x=>x.count),
        backgroundColor:'#d4a24e', borderRadius:3 }] },
      options:{ responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{display:false} },
        scales:{ x:{ ticks:{color:'#6f675b',maxTicksLimit:12}, grid:{display:false} },
                 y:{ ticks:{color:'#6f675b'}, grid:{color:'#221e18'} } } }
    });

    document.getElementById('foot').textContent =
      `Zdroje: gastro_odeslane.json · outreach/odeslane.json · Hofo Obchod · Gmail · Lead Finder (Render)`;
  })
  .catch(e => { document.getElementById('updated').textContent = 'Chyba načtení dat: ' + e; });
</script>
</body>
</html>
